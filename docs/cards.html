<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snow Guide Cards</title>
<meta name="description" content="34 phone-size cards on Somerville's snow and ice rules, ready to share. By the Somerville PTAC.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;margin-top:36px}
.gallery figure{margin:0;display:flex;flex-direction:column;gap:8px}
.gallery img{width:100%;height:auto;border-radius:14px;display:block;box-shadow:0 2px 0 rgba(16,36,58,.08)}
.gallery figcaption{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:15px}
.gallery figcaption b{font-family:var(--display);text-transform:uppercase;font-size:18px;line-height:1}
</style>
</head>
<body>
<header class="bar"><div class="wrap"><a class="brand" href="./">Somerville <span>Snow</span></a><nav class="nav"><a href="./">Back to the guide</a></nav></div></header>
<section>
  <div class="wrap">
    <div class="eyebrow">Share them</div>
    <h2 style="margin-top:14px">The cards</h2>
    <p class="lede" style="margin-top:18px">Phone-size. Tap one to open it full size, then save or share.</p>
    <div class="gallery" id="gallery"></div>
  </div>
</section>
<footer><div class="wrap"><p>By the Somerville PTAC. Not an official City page. Official rules: <a href="https://www.somervillema.gov/snow">somervillema.gov/snow</a></p></div></footer>
<script type="module">
const cards = await (await fetch('cards/cards.json')).json();
document.getElementById('gallery').innerHTML = cards.map((c) => `
  <figure>
    <a href="cards/${c.file}.png"><img src="cards/${c.file}.png" alt="${c.heading}" loading="lazy" width="1080" height="1920"></a>
    <figcaption><b>${c.n}. ${c.title}</b><a href="cards/${c.file}.png" download>Save</a></figcaption>
  </figure>`).join('');
</script>
</body>
</html>
