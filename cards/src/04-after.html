<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shovel your sidewalk on time</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">

body{margin:0}
a{color:#B93D06}a:hover{color:#10243A}
</style>

<body>
<div style="width: 1080px; height: 1920px; box-sizing: border-box; padding: 150px 80px 120px; display: flex; flex-direction: column; gap: 40px; background: #EEF3F7; color: #10243A; font-family: 'Barlow', 'Helvetica Neue', sans-serif">
<div style="display: flex; justify-content: space-between; align-items: center; font-family: 'Barlow Condensed', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: 2px">
<div style="color: #B93D06">THE SIDEWALK RULE</div>
<div style="color: #47607C">SOMERVILLE, MA</div>
</div>
<h1 style="margin: 0; font-family: 'Barlow Condensed', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 160px; line-height: 0.88; text-transform: uppercase">Clear your<br>sidewalk<br>on time</h1>
<div style="display: flex; flex-direction: column; gap: 40px; flex-grow: 1; justify-content: center">
<div style="display: flex; align-items: center; gap: 36px">
<div style="font-family: 'Barlow Condensed', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 440px; line-height: 0.8; color: #B93D06">6</div>
<div style="font-family: 'Barlow Condensed', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 150px; line-height: 0.9; text-transform: uppercase">Daylight<br>hours</div>
</div>
<div style="font-size: 52px; line-height: 1.25; font-weight: 500; color: #2C4460">after the snow stops falling.</div>
<div style="background: #10243A; color: #FFFFFF; border-radius: 28px; padding: 40px 44px; display: flex; flex-direction: column; gap: 14px">
<div style="font-family: 'Barlow Condensed', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 64px; line-height: 1; text-transform: uppercase">Snow stopped overnight?</div>
<div style="font-size: 52px; line-height: 1.1; font-weight: 500">The 6 hours start at</div>
<div style="font-family: 'Barlow Condensed', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 170px; line-height: 0.92; text-transform: uppercase; color: #FF8A3D">Sunrise</div>
<div style="font-size: 44px; line-height: 1.25; font-weight: 400">In midwinter that means done by 1 p.m.</div>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 28px; color: #47607C">
<div>Somerville PTAC</div>
<div>somervillema.gov/snow</div>
</div>
</div>
