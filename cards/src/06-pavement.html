<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shovel down to the pavement</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#B93D06}a:hover{color:#10243A}
</style>
<style>html,body{margin:0;background:#10243A}</style>
</head>
<body>
<div style="width: 1080px; height: 1920px; box-sizing: border-box; padding: 150px 80px 120px; display: flex; flex-direction: column; gap: 40px; background: #EEF3F7; color: #10243A; font-family: 'Barlow', 'Helvetica Neue', sans-serif">
<div style="display: flex; justify-content: space-between; align-items: center; font-family: 'Barlow Condensed', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: 2px">
<div style="color: #B93D06">THE SIDEWALK RULE</div>
<div style="color: #47607C">SOMERVILLE, MA</div>
</div>
<h1 style="margin: 0; font-family: 'Barlow Condensed', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 160px; line-height: 0.88; text-transform: uppercase">Shovel<br>down to the<br>pavement</h1>
<div style="display: flex; flex-direction: column; gap: 40px; flex-grow: 1; justify-content: center">
<svg viewBox="0 0 920 640" width="920" height="640" role="img" aria-label="Two sidewalks compared: one with a narrow, patchy track marked not done, and one cleared three feet wide to bare pavement marked done" style="display: block; border-radius: 28px; flex-shrink: 0">
<rect width="920" height="640" fill="#FFFFFF"></rect>
<rect x="0" y="110" width="920" height="80" fill="#5E6C7B"></rect>
<g fill="#FFFFFF">
<ellipse cx="150" cy="150" rx="90" ry="34"></ellipse><ellipse cx="400" cy="140" rx="70" ry="30"></ellipse><ellipse cx="610" cy="160" rx="100" ry="32"></ellipse><ellipse cx="840" cy="146" rx="60" ry="30"></ellipse>
</g>
<g fill="#DCE8F5">
<ellipse cx="280" cy="160" rx="40" ry="14"></ellipse><ellipse cx="500" cy="170" rx="36" ry="12"></ellipse><ellipse cx="740" cy="132" rx="40" ry="12"></ellipse>
</g>
<circle cx="70" cy="252" r="34" fill="none" stroke="#B93D06" stroke-width="8"></circle>
<path d="M54 236 L86 268 M86 236 L54 268" stroke="#B93D06" stroke-width="8" stroke-linecap="round"></path>
<text x="124" y="270" font-family="Barlow Condensed, sans-serif" font-weight="700" font-size="56" fill="#B93D06">NOT DONE: NARROW, PATCHY, ICY</text>
<rect x="0" y="318" width="920" height="6" fill="#DCE8F5"></rect>
<rect x="0" y="370" width="920" height="170" fill="#5E6C7B"></rect>
<rect x="44" y="574" width="60" height="50" rx="10" fill="#10243A"></rect>
<path d="M58 600 L70 612 L92 586" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
<text x="124" y="618" font-family="Barlow Condensed, sans-serif" font-weight="700" font-size="56" fill="#10243A">DONE: 3 FEET OF BARE SIDEWALK</text>
</svg>
<div style="font-size: 52px; line-height: 1.25; font-weight: 500; color: #2C4460">No packed snow, no ice, no leftover spots on the sidewalk.</div>
<div style="font-size: 42px; line-height: 1.25; color: #47607C">Where ice will not come off, the ordinance says to cover it with sand.</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 28px; color: #47607C">
<div>Somerville PTAC</div>
<div>somervillema.gov/snow</div>
</div>
</div>
</body>
</html>
