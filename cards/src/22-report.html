<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report an unshoveled sidewalk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#B93D06}a:hover{color:#10243A}
</style>
<style>html,body{margin:0;background:#10243A}</style>
</head>
<body>
<div style="width: 1080px; height: 1920px; box-sizing: border-box; padding: 150px 80px 120px; display: flex; flex-direction: column; gap: 40px; background: #EEF3F7; color: #10243A; font-family: 'Barlow', 'Helvetica Neue', sans-serif">
<div style="display: flex; justify-content: space-between; align-items: center; font-family: 'Barlow Condensed', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: 2px">
<div style="color: #B93D06">NOT CLEARED?</div>
<div style="color: #47607C">SOMERVILLE, MA</div>
</div>
<h1 style="margin: 0; font-family: 'Barlow Condensed', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 170px; line-height: 0.88; text-transform: uppercase">Icy or<br>unshoveled?<br>Report it.</h1>
<div style="display: flex; flex-direction: column; gap: 40px; flex-grow: 1; justify-content: center">
<div style="background: #FFFFFF; color: #10243A; border-radius: 28px; padding: 40px 44px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'Barlow Condensed', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 56px; line-height: 1; color: #B93D06">CALL</div>
<div style="font-size: 50px; line-height: 1.15; font-weight: 600">311 or 617-666-3311</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'Barlow Condensed', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 56px; line-height: 1; color: #B93D06">APP</div>
<div style="font-size: 50px; line-height: 1.15; font-weight: 600">311Somerville</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'Barlow Condensed', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 56px; line-height: 1; color: #B93D06">EMAIL</div>
<div style="font-size: 50px; line-height: 1.15; font-weight: 600">311requests@somervillema.gov</div>
</div>
</div>
<div style="font-size: 52px; line-height: 1.25; font-weight: 500; color: #2C4460">The City sends your report to Public Works.</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 28px; color: #47607C">
<div>Somerville PTAC</div>
<div>somervillema.gov/snow</div>
</div>
</div>
</body>
</html>
